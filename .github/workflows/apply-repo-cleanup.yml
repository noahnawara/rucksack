name: apply repository cleanup

on:
  push:
    branches:
      - codex/remove-hosted-impeccable
    paths:
      - .github/workflows/apply-repo-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hosted tooling and simplify setup
        env:
          INSTALL_MD_B64: 
          SETUP_PROMPT_B64: 
        run: |
          set -euo pipefail
          git rm -r -- .agents/skills/impeccable
          if ! grep -qxF '/.agents/' .gitignore; then
            echo '/.agents/' >> .gitignore
          fi
          printf '%s' "$INSTALL_MD_B64" | base64 --decode > INSTALL.md
          printf '%s' "$SETUP_PROMPT_B64" | base64 --decode > site/src/content/install-agent-prompt.txt
          git rm -- .github/workflows/apply-repo-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore INSTALL.md site/src/content/install-agent-prompt.txt
          git diff --cached --check
          git commit -m 'chore(repo): keep design tooling local' -m 'Remove the hosted Impeccable bundle and move setup detail from the clipboard into INSTALL.md.'
          git push origin HEAD:codex/remove-hosted-impeccable
