name: Release

# Run by hand, because signing is still a release gate rather than something this repository can
# do. There are no Developer ID certificates in `secrets` yet, so on every tag this failed at
# `security import` with an empty .p12 — three tags, three red runs, no published release.
#
# Publishing without them is not the alternative. A helper built without `RUCKSACK_TEAM_ID`
# authenticates clients by user id alone and says so itself, in
# `crates/rucksack-helper/src/server.rs`: "Do not distribute this binary." An unsigned package
# would be a weaker artifact wearing a release's clothes.
#
# The documented install path does not depend on this. README, INSTALL.md, and the website's agent
# prompt all install with `cargo install --git --tag`, which builds from the tag and touches no
# release asset. `scripts/install.sh` is the one that wants a package, and INSTALL.md already says
# not to run it until a signed release exists.
#
# Put `push: tags:` back the day the four `APPLE_*` secrets are set. Everything below is ready.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  signed-macos-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.86.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # A tag trigger could only ever be a tag. A manual one can be anything the dropdown offers, and
      # both the version and the release name are read out of the ref further down — so a run
      # started from a branch would build for twenty minutes and then fail at `gh release create`
      # with a name no tag has. Say so in the first five seconds instead.
      - name: Require a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this on a release tag. $GITHUB_REF_NAME is a $GITHUB_REF_TYPE, and the package version and release name both come from the ref."
            exit 1
          fi

      - name: Validate release candidate
        env:
          RUCKSACK_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --release --locked -- -D warnings
          cargo test --workspace --release --locked

      - name: Import Developer ID certificates
        env:
          APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          keychain_path="$RUNNER_TEMP/rucksack-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLICATION_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/application.p12" -k "$keychain_path" -P "$APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain_path" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

      - name: Build and sign package
        env:
          RUCKSACK_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
          RUCKSACK_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          RUCKSACK_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          RUCKSACK_VERSION="${GITHUB_REF_NAME#v}"
          export RUCKSACK_VERSION
          scripts/build-macos-package.sh

      - name: Notarize and staple
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          shopt -s nullglob
          package_paths=(dist/*.pkg)
          if [[ "${#package_paths[@]}" -ne 1 ]]; then
            echo "Expected exactly one package in dist, found ${#package_paths[@]}" >&2
            exit 1
          fi
          package_path="${package_paths[0]}"
          umask 077
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool submit "$package_path" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$package_path"
          xcrun stapler validate "$package_path"
          spctl --assess --type install --verbose=2 "$package_path"
          package_directory="$(dirname "$package_path")"
          package_name="$(basename "$package_path")"
          (
            cd "$package_directory"
            shasum -a 256 "$package_name" > "$package_name.sha256"
          )

      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.pkg
            dist/*.pkg.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/*.pkg.sha256 --generate-notes --verify-tag
