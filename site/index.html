<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a07" />
    <meta
      name="description"
      content="Keep your coding agent running on your commute with rucksack."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="rucksack — keep your agent running on your commute"
    />
    <meta
      property="og:description"
      content="rucksack is packing the Mac. Keep steering the same session from your phone."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>rucksack — keep your agent running on your commute</title>
  </head>
  <body id="top">
    <a class="skip-link" href="#main">skip to content</a>

    <header class="site-header page-shell">
      <a class="wordmark" href="#top" aria-label="rucksack home">
        <span class="route-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 19V5h6c3 0 5 1.5 5 4s-2 4-5 4H6" />
            <path d="m12 13 6 6" />
          </svg>
        </span>
        <span>rucksack</span>
      </a>

      <a
        class="github-link"
        href="https://github.com/noahnawara/rucksack"
        aria-label="rucksack on GitHub; star count unavailable"
        data-github-link
      >
        <span>github</span>
        <span aria-hidden="true">★</span>
        <span aria-hidden="true" data-github-star-count>—</span>
      </a>
    </header>

    <main id="main" class="hero page-shell">
      <section class="intro" aria-labelledby="headline">
        <h1 id="headline">keep your agent running on your commute</h1>
        <p class="lead">
          rucksack is packing the Mac. keep steering from your phone.
        </p>
      </section>

      <figure
        class="pass-stage"
        id="pass-stage"
        aria-labelledby="pass-caption"
        aria-describedby="pass-summary"
      >
        <figcaption class="visually-hidden" id="pass-caption">
          rucksack digital commute pass
        </figcaption>
        <p class="visually-hidden" id="pass-summary">
          rucksack is packing the Mac. Keep steering the same live session from
          your phone. rucksack is unpacking automatically when regular wifi
          returns.
        </p>

        <article class="pass">
          <header class="pass-head">
            <span class="pass-brand">
              <span class="pass-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6 19V5h6c3 0 5 1.5 5 4s-2 4-5 4H6" />
                  <path d="m12 13 6 6" />
                </svg>
              </span>
              <span class="pass-title">commute pass</span>
            </span>
            <span class="pass-code">preview</span>
          </header>

          <div class="pass-body">
            <span class="scan-line" aria-hidden="true"></span>

            <div class="route">
              <span class="stop">
                <span class="stop-action">rucksack is packing</span>
                <strong class="stop-name">Mac</strong>
              </span>

              <span class="route-transfer" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 12h15" />
                  <path d="m14 7 5 5-5 5" />
                </svg>
              </span>

              <span class="stop">
                <span class="stop-action">you continue</span>
                <strong class="stop-name">phone</strong>
              </span>
            </div>

            <div class="validation-row">
              <p class="session-state">
                <span class="session-label">same session</span>
                <strong class="session-result">still live</strong>
              </p>
              <span class="validation-stamp">PACKED</span>
            </div>
          </div>

          <div class="return-watch">
            <span class="return-owner">regular wifi</span>
            <span class="return-result">
              rucksack is unpacking automatically
            </span>
          </div>

          <button
            class="copy-button"
            id="copy-prompt"
            type="button"
            data-copy-prompt
          >
            <span class="copy-text">copy agent prompt</span>
            <span class="copy-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="8" y="8" width="10" height="10" />
                <path d="M15 8V5H5v10h3" />
              </svg>
            </span>
          </button>
        </article>

        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>

        <div class="manual-copy" id="manual-copy">
          <p class="no-js-message">
            open the prompt below and copy it into your agent.
          </p>
          <details id="install-prompt-details">
            <summary>read the complete agent prompt</summary>
            <pre
              id="install-prompt-container"
              tabindex="0"
              aria-label="Complete rucksack installation agent prompt"
            ><code id="install-prompt">%%rucksack_install_agent_prompt%%</code></pre>
          </details>
        </div>
      </figure>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
