[workspace]
members = [
  "crates/rucksack-core",
  "crates/rucksack-cli",
  "crates/rucksack-helper",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/noahnawara/rucksack"
homepage = "https://www.rucksack.wtf/"
authors = ["rucksack contributors"]
keywords = ["macos", "codex", "claude-code", "cursor", "remote-control"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
libc = "0.2"
regex = "1.11"
# No TLS feature and no `json`, deliberately. The only request rucksack makes is the captive-network
# probe, which is plain HTTP to a fixed host by design — see docs/THREAT_MODEL.md — and nothing in the
# workspace calls `.json()`. Carrying rustls for a request that never uses it made every user compile
# rustls, rustls-webpki, webpki-roots, hyper-rustls and tokio-rustls, which is most of the wait when
# install time is `cargo install`.
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "2.0"
toml = "1.1"
uuid = { version = "1.12", features = ["serde", "v4"] }
